[project]
name = "chevstyle-backend"
version = "0.1.0"
description = "Backend foundation for the Chevstyle AI hairstyle platform"
readme = "README.md"
authors = [
    { name = "Malachi", email = "dminsalami@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "convex>=0.7.0",
    "pillow>=12.3.0",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    "google-generativeai>=0.8.6",
    "mediapipe>=1.0.0",
    "google-genai>=2.18.0",
    "moondream>=2.0.1",
    "tqdm>=4.66.0",
    "openai>=1.52.0",
    "cairosvg>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
chevstyle-backend = "chevstyle_backend:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
